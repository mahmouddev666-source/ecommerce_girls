[build]
command = "pnpm build:client"
functions = "netlify/functions"
publish = "dist/spa"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"
